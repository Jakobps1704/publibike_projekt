[project]
name = "publibike"
version = "0.1.0"
description = "Collect and analyse PubliBike station data in Zurich"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Scripts are run directly; install only the dependencies.
packages = []
