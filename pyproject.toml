[project]
name = "publibike"
version = "0.1.0"
description = "Collect and analyse PubliBike station data in Zurich"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
# For publibike.data and notebooks: pip install -e ".[analysis]"
analysis = [
    "pandas>=2.2",
    "pyarrow>=17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["publibike"]
