name: Sync stations

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC (off the hour, when Actions is less busy)
  workflow_dispatch:        # manual run from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python collector/sync_stations.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
